[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "srtgo"
authors = [
    {name = "DKim", email = "lapis42@gmail.com"},
]
description = "SRTgo: K-Train Reservation Helper"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click",
    "curl_cffi",
    "requests",
    "inquirer>=3.4",
    # blessed 1.40+ 는 켜질 때 터미널에 기능 질의를 보내는데, 윈도 기본 콘솔은 이걸 못 알아듣고
    # 'P+q544e...' 같은 글자로 화면에 찍는다. 질의가 없던 마지막 버전대로 묶어 둔다.
    "blessed>=1.19,<1.40",
    "keyring",
    "PyCryptodome",
    "prompt_toolkit>=3",
    "python-telegram-bot",
    "termcolor"
]
dynamic = ["version"]
[tool.setuptools_scm]

[project.urls]
Homepage = "https://github.com/lapis42/srtgo"

[project.scripts]
srtgo = "srtgo.srtgo:srtgo"
srtgo-bot = "srtgo.bot:main"
srtgo-watchdog = "srtgo.watchdog:main"